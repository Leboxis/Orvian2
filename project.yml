name: Orvian2
options:
  bundleIdPrefix: com.orvian2
  createIntermediateGroups: true
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  Orvian2:
    type: application
    platform: iOS
    sources: [{ path: Orvian2 }]
    info:
      path: Orvian2/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orvian2.app
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Orvian2:
    build: { targets: { Orvian2: all } }
    run: { config: Debug }
    archive: { config: Release }
